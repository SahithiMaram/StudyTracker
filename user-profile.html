<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Study Tracker 📚 - Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Profile</h1>
    <p><strong>Username:</strong> <span id="usernameDisplay"></span></p>
    <p><strong>Total Tasks:</strong> <span id="totalTasks">0</span></p>
    <p><strong>Completed Tasks:</strong> <span id="completedTasks">0</span></p>
    <p><strong>Pending Tasks:</strong> <span id="pendingTasks">0</span></p>

    <div class="progress-container">
      <p>Completion Progress:</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFillProfile"></div>
      </div>
      <p id="progressTextProfile">0% completed</p>
    </div>

    <button id="goDashboard">Go to Dashboard</button>
    <button id="logoutBtn">Logout</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
